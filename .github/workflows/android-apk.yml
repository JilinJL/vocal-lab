name: Build Signed Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.1.12297006" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0"

      - name: Install dependencies and run tests
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - name: Build web bundle and sync Capacitor Android
        run: pnpm cap:sync

      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/vocallab-release.jks"
          chmod 600 "${RUNNER_TEMP}/vocallab-release.jks"

      - name: Assemble Signed Android Release APK (C++17 + Oboe)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/vocallab-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature and generate update.json manifest
        id: apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          APK_NAME="VocalLab-${VERSION}-android-release.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"

          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME"

          SHA256=$(sha256sum "$APK_NAME" | awk '{print $1}')
          SIZE_BYTES=$(stat -c%s "$APK_NAME")
          VERSION_CODE=$(grep -E 'versionCode\s+[0-9]+' android/app/build.gradle | head -n1 | awk '{print $2}')
          VERSION_NAME=$(grep -E 'versionName\s+"[^"]+"' android/app/build.gradle | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/${APK_NAME}"
          RELEASE_NOTES=$(git log -1 --pretty=%B | head -n 8)

          export VERSION_NAME VERSION_CODE APK_NAME APK_URL SHA256 SIZE_BYTES PUBLISHED_AT RELEASE_NOTES
          node -e '
            const fs = require("fs");
            const manifest = {
              schemaVersion: 1,
              appId: "com.vocallab.app",
              versionName: process.env.VERSION_NAME,
              versionCode: Number(process.env.VERSION_CODE),
              apkName: process.env.APK_NAME,
              apkUrl: process.env.APK_URL,
              sha256: process.env.SHA256,
              sizeBytes: Number(process.env.SIZE_BYTES),
              minAndroidSdk: 24,
              publishedAt: process.env.PUBLISHED_AT,
              releaseNotes: process.env.RELEASE_NOTES.trim(),
            };
            fs.writeFileSync("update.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          cat update.json
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: |
            ${{ steps.apk.outputs.apk_name }}
            update.json

      - name: Publish Signed APK & update.json to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK_NAME="${{ steps.apk.outputs.apk_name }}"
          SHA256="${{ steps.apk.outputs.sha256 }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" update.json --clobber
          else
            NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
            {
              echo "正式签名 Release APK（支持应用内自动检查、SHA-256 校验与覆盖安装）。"
              echo ""
              echo "- 文件：\`${APK_NAME}\`"
              echo "- SHA-256：\`${SHA256}\`"
            } > "$NOTES_FILE"
            gh release create "$TAG" "$APK_NAME" update.json \
              --title "VocalLab $TAG" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Cleanup temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/vocallab-release.jks"
